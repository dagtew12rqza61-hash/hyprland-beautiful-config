include ~/.config/kitty/color-scheme.conf

# Font Configuration
font_family JetBrains Mono
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic

font_size 11.0
letter_spacing 0.0
line_height 1.3

# Disable ligatures if desired, or enable selective ligatures
disable_ligatures never

# Window Configuration
remember_window_size yes
initial_window_width 120c
initial_window_height 40c
window_border_width 1.0
window_margin_width 8 8 8 8
window_padding_width 12 12 12 12
draw_minimal_borders yes
single_window_margin_width -1000

# Transparency
background_opacity 0.90
background_blur 15

# Cursor
cursor_shape beam
cursor_thickness 2.0
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0

# Mouse
mouse_hide_wait 3.0
url_style curly
open_url_with firefox
detect_urls yes
url_prefixes http https file ftp

# Selection
select_by_word_characters @-./_~?&=%+#

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
tab_title_template {index}:{title}
active_tab_foreground #1e1e2e
active_tab_background #89dceb
inactive_tab_foreground #a6adc8
inactive_tab_background #313244

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 2.0

# Audio Bell
enable_audio_bell yes
bell_on_tab yes
command_on_bell notify-send "Kitty Bell"

# Bell animation
visual_bell_duration 0.0

# Key Bindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection
map ctrl+shift+o pass_selection_to_program

# New window
map ctrl+shift+n new_window
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+alt+t set_tab_title

# Font size
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Layout
map ctrl+l next_layout

# Shell
shell /bin/zsh

# Plugins
include plugins.conf
