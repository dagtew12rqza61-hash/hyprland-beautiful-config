# Hyprland Configuration
# Beautiful Desktop Environment with Transparency Effects

monitor = HDMI-1, 1920x1080@60, 0x0, 1
monitor = eDP-1, 1920x1080@60, 1920x0, 1

# Window Configuration
general {
    gaps_in = 10
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(89dcebff) rgba(f5c2e6ff) 45deg
    col.inactive_border = rgba(45475aff)
    layout = dwindle
}

# Decoration (Transparency & Effects)
decoration {
    rounding = 15
    
    # Blur effect
    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = false
    }
    
    # Shadow effect
    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = rgba(1e1e2eff)
    
    # Active window glow
    dim_inactive = true
    dim_strength = 0.2
}

# Animation Configuration
animations {
    enabled = true
    
    # Bezier curves for smooth animations
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, smoothOut
    animation = windowsMove, 1, 4, myBezier
    animation = fade, 1, 3, smoothIn
    animation = fadeDim, 1, 3, smoothIn
    animation = border, 1, 4, myBezier
    animation = borderangle, 1, 8, myBezier
    animation = workspaces, 1, 5, myBezier
    animation = specialWorkspace, 1, 5, myBezier
}

# Input Configuration
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    
    follow_mouse = 1
    mouse_refocus = false
    float_switch_override_focus = 2
    
    touchpad {
        natural_scroll = true
        scroll_factor = 1.0
    }
}

# Gestures
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
}

# Dwindle Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# Master Layout
master {
    new_status = master
    no_gaps_when_only = false
}

# Misc Settings
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    mouse_move_focuses_monitor = true
    animate_manual_resizes = true
    animate_mouse_windowdrag = true
    focus_on_activate = true
    close_special_on_empty = true
}

# Key Bindings
$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, space, exec, rofi -show drun -theme ~/.config/rofi/config.rasi
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Window Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace Navigation
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse Bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume Control
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brightness Control
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot.png
bind = $mainMod, Print, exec, grim ~/Pictures/screenshot.png

# Startup Applications
exec-once = waybar
exec-once = swaybg -i ~/.config/hypr/wallpaper.png
exec-once = dunst
exec-once = wl-paste --watch cliphist store
