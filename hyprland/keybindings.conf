# Extended keybindings configuration
# Add this to your hyprland.conf for additional functionality

# Applications
$mainMod = SUPER
bind = $mainMod, T, exec, kitty
bind = $mainMod SHIFT, T, exec, kitty --start-as=fullscreen
bind = $mainMod, B, exec, firefox
bind = $mainMod, N, exec, nautilus
bind = $mainMod, A, exec, code

# Quick launch favorites
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3

# Window management
bind = $mainMod, W, togglefloating,
bind = $mainMod, Z, fullscreen,
bind = $mainMod, S, pseudo,

# Focus switching
bind = $mainMod, Tab, cyclenext,
bind = $mainMod SHIFT, Tab, cycleprev,

# Resize windows
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50

# Move windows
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Special workspace (scratchpad)
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# Workspace switching with mouse wheel
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1

# Screenshot with region selection
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png
bind = SHIFT, Print, exec, grim ~/Pictures/screenshot-$(date +%s).png

# Color picker
bind = $mainMod, C, exec, hyprpicker -a

# Screen lock
bind = $mainMod, L, exec, swaylock -c 1e1e2e

# Power menu
bind = $mainMod SHIFT, Q, exec, rofi -show power-menu -theme ~/.config/rofi/config.rasi

# Volume and brightness (already in main config, but here for reference)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Restart Waybar
bind = $mainMod CTRL, R, exec, pkill waybar; sleep 0.5; waybar &
